<!doctype html>

      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        padding: 16px;
      }

      main {
        display: grid;
        gap: 12px;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      button {
        min-height: 36px;
        padding: 0 12px;
        border: 1px solid #8f99a8;

        color: CanvasText;
        cursor: pointer;
      }

      button:disabled {
        cursor: default;
        opacity: 0.55;
      }

      pre {
        overflow: auto;
        min-height: 240px;
        max-height: 64vh;
        padding: 12px;
        border: 1px solid #8f99a8;
        border-radius: 6px;
        white-space: pre-wrap;
      }

        <button id="download-json" type="button" disabled>Download JSON</button>
