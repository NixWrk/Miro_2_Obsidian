[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "miro-2-obsidian"
version = "0.1.0"
description = "Miro Full Exporter: portable public-API exports with provenance and optional Canvas conversion"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "customtkinter==6.0.0",
    "requests==2.34.2",
    "jsonschema==4.23.0",
    "keyring==25.7.0",
    "playwright==1.62.0",
]

[project.scripts]
miro2obsidian = "scripts.miro_pipeline:main"
miro2obsidian-gui = "Miro_2_Obsidian_GUI:main"

[tool.setuptools]
py-modules = ["Miro_2_Obsidian_GUI"]

[tool.setuptools.package-data]
# The board schema and its compatibility fixtures are the contract the
# plugin pins; they ship with the package.
miro2obsidian = ["schemas/v1/*.json", "schemas/v1/fixtures/*.json", "schemas/v1/fixtures/*/*.canvas"]

[tool.setuptools.data-files]
"share/miro2obsidian/websdk" = [
    "tools/miro_websdk_exporter/index.html",
    "tools/miro_websdk_exporter/panel.html",
    "tools/miro_websdk_exporter/exporter.js",
    "tools/miro_websdk_exporter/theme.css",
    "tools/miro_websdk_exporter/ui.js",
    "tools/miro_websdk_exporter/icon-outline.svg",
    "tools/miro_websdk_exporter/icon-color.svg",
    "tools/miro_websdk_exporter/manifest.example.yml",
]

[tool.setuptools.packages.find]
include = [
    "Json_2_Canvas*",
    "Miro_2_Json*",
    "scripts*",
    "miro2obsidian*",
]
[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", ".venv", "venv", "work", "build", "dist"]
